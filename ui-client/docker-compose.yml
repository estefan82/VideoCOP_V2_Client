services:
  gui:
    build: .
    container_name: customtkinter-gui
    restart: unless-stopped
    ports:
      - "1001:1001"
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1000
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/1000/wayland-0:/run/user/1000/wayland-0:rw